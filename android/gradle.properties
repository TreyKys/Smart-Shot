org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# TEMPORARY — forcing this off to rule out the build cache silently
# restoring a stale, debug-signed bundleRelease output from before
# key.properties existed, even though the output directory was deleted
# between runs. Overrides any global org.gradle.caching=true a machine's
# ~/.gradle/gradle.properties might set that we can't see from here.
org.gradle.caching=false
